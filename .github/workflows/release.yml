name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ github.ref_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up Go
        uses: actions/setup-go@3041bf56c941b39c61721a86cd11f3bb1338122a # v5.2.0
        with:
          go-version: '1.25'
          check-latest: true
      - name: Test
        run: go test ./... -race
      - name: Build release binaries
        run: |
          set -euo pipefail
          mkdir -p dist
          platforms="linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64 windows/arm64"
          for p in $platforms; do
            os="${p%/*}"; arch="${p#*/}"
            out="nginx-doctor_${TAG}_${os}_${arch}"
            bin="nginx-doctor"
            [ "$os" = "windows" ] && bin="nginx-doctor.exe"
            echo "building $out"
            CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" \
              go build -trimpath -ldflags "-s -w -X main.version=${TAG}" \
              -o "dist/${bin}" ./cmd/nginx-doctor
            ( cd dist && tar -czf "${out}.tar.gz" "$bin" && rm -f "$bin" )
          done
          ( cd dist && sha256sum *.tar.gz > checksums.txt )
          ls -l dist
      - name: Create or update release
        run: |
          set -euo pipefail
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --title "$TAG" --generate-notes
          fi
          gh release upload "$TAG" dist/*.tar.gz dist/checksums.txt --clobber
