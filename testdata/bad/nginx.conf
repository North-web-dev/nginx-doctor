user www-data;
worker_processes auto;

events {
    worker_connections 256;
}

http {
    gzip off;
    server_tokens on;
    add_header X-Frame-Options "SAMEORIGIN";

    upstream app {
        server 127.0.0.1:8080;
    }

    server {
        listen 80;
        listen 443 ssl;
        server_name example.com;

        ssl_certificate /etc/ssl/example.crt;
        ssl_certificate_key /etc/ssl/example.key;
        ssl_protocols TLSv1 TLSv1.1 TLSv1.2;
        ssl_ciphers 'HIGH:!aNULL:RC4:DES-CBC3-SHA';

        root /var/www/example;
        index index.html;
        autoindex on;

        add_header X-Served-By "nginx";

        location / {
            try_files $uri $uri/ =404;
        }

        location /legacy {
            if (!-f $request_filename) {
                rewrite ^ /index.php last;
            }
        }

        location /api {
            proxy_pass http://app;
        }

        location /dynamic {
            proxy_pass https://$host/backend;
        }
    }

    server {
        listen 443 ssl;
        server_name example.com;
        ssl_certificate /etc/ssl/dup.crt;
        ssl_certificate_key /etc/ssl/dup.key;
        root /var/www/dup;
    }
}
